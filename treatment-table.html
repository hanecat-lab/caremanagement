<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>利用者別処置表</title>
<style>
  :root {
    --bg: #f0ede8;
    --panel: #ffffff;
    --border: #ddd9d0;
    --line: #999;
    --line-strong: #555;
    --text: #2c2a26;
    --text-sub: #7a7568;
    --accent: #3d6b8a;
    --accent-light: #e8f0f5;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Sans JP', sans-serif;
    -webkit-text-size-adjust: 100%;
  }

  .app-header {
    background: var(--accent);
    color: #fff;
    padding: 12px 16px;
  }
  .app-header h1 { margin: 0; font-size: 18px; font-weight: 700; }

  .toolbar {
    display: flex;
    gap: 8px;
    align-items: center;
    flex-wrap: wrap;
    padding: 12px 16px;
  }
  .btn {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 8px;
    font-family: inherit;
    font-size: 13px;
    font-weight: 700;
    padding: 8px 16px;
    cursor: pointer;
  }
  .btn.secondary {
    background: #fff;
    color: var(--accent);
    border: 1px solid var(--accent);
  }
  .hint { font-size: 11px; color: var(--text-sub); }

  .sheets { padding: 0 16px 24px; }

  .sheet {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px;
    margin-bottom: 18px;
  }
  .sheet-title {
    font-size: 15px;
    font-weight: 700;
    text-align: center;
    margin-bottom: 10px;
  }

  /* 左右で行の高さを独立させるため、左右を別テーブルにして横並びにする */
  .columns {
    display: flex;
    gap: 10px;
    align-items: flex-start;
  }
  .col { flex: 1; min-width: 0; }

  table.tx {
    width: 100%;
    border-collapse: collapse;
    table-layout: fixed;
  }
  table.tx th, table.tx td {
    border: 1px solid var(--line);
    padding: 0;
    vertical-align: top;
  }
  table.tx th {
    background: var(--accent-light);
    color: var(--text);
    font-size: 11px;
    font-weight: 700;
    text-align: center;
    padding: 4px 2px;
  }
  .c-room { width: 18%; }
  .c-name { width: 26%; }
  .c-tx   { width: 56%; }

  /* 号室結合セル */
  td.room-cell {
    text-align: center;
    vertical-align: middle;
    font-size: 13px;
    font-weight: 700;
    background: #faf8f4;
    padding: 2px;
    word-break: break-all;
  }
  /* 居室の区切り線（各居室の先頭行の上罫線を太く） */
  tr.room-start > td { border-top: 2px solid var(--line-strong); }

  .cell-input, .cell-area {
    width: 100%;
    border: none;
    outline: none;
    font-family: inherit;
    color: var(--text);
    background: transparent;
    padding: 4px 5px;
  }
  .cell-input {
    font-size: 12px;
    text-align: center;
    height: 100%;
  }
  .cell-area {
    font-size: 12px;
    line-height: 1.4;
    resize: none;
    overflow: hidden;
    min-height: 26px;
    display: block;
  }

  .margin-row {
    margin-top: 10px;
    display: flex;
    gap: 10px;
  }
  .margin-cell {
    flex: 1;
    border: 1px solid var(--line);
    min-height: 70px;
  }
  .margin-label {
    font-size: 10px;
    color: var(--text-sub);
    padding: 3px 5px 0;
  }
  .margin-area {
    width: 100%;
    border: none;
    outline: none;
    resize: none;
    overflow: hidden;
    font-family: inherit;
    font-size: 12px;
    line-height: 1.5;
    background: transparent;
    padding: 2px 5px 5px;
    min-height: 52px;
    display: block;
  }

  @media print {
    @page { size: A4 landscape; margin: 8mm; }
    body { background: #fff; }
    .app-header, .toolbar { display: none !important; }
    .sheets { padding: 0; }
    .sheet {
      border: none;
      border-radius: 0;
      padding: 0;
      margin: 0;
      page-break-after: always; /* 2階 / 3階 を別用紙に */
    }
    .sheet:last-child { page-break-after: auto; }
    .cell-input, .cell-area, .margin-area { color: #000; }
    /* インク節約：背景はすべて白で統一 */
    table.tx th, td.room-cell { background: #fff !important; color: #000; }
  }
</style>
</head>
<body>

<div class="app-header">
  <h1>利用者別処置表</h1>
</div>

<div class="toolbar">
  <button class="btn" onclick="window.print()">🖨 印刷</button>
  <span class="hint">名前・処置はセルに直接入力でき、内容は自動保存されます（2階／3階は別用紙・A4横向き推奨）</span>
</div>

<div class="sheets" id="sheets"></div>

<script>
const STORAGE_KEY = 'treatment_table_v2';

// ===== 居室定義（careplan-manager の buildFloorDef を移植）=====
// 部屋番号に 4 または 9 を含む部屋は除外。ベッド数は末尾2桁で判定。
function buildFloorDef(from, to) {
  const rooms = [];
  for (let n = from; n <= to; n++) {
    const s = String(n);
    if (s.includes('4') || s.includes('9')) continue;
    const num = parseInt(s.slice(-2) || s);
    let beds;
    if (num === 7) beds = 1;
    else if ((num >= 2 && num <= 6) || n === 316 || n === 301 || n === 212 || n === 213) beds = 2;
    else beds = 4;
    rooms.push({ room: String(n), beds });
  }
  return rooms;
}
const FLOOR_200 = buildFloorDef(201, 218);
const FLOOR_300 = buildFloorDef(301, 316);

// ===== 保存データ（入力値のみ。構成は居室定義から毎回生成）=====
let store = { cells: {}, margins: {} };

function load() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) store = JSON.parse(raw);
  } catch (e) { store = { cells: {}, margins: {} }; }
  if (!store || typeof store !== 'object') store = {};
  if (!store.cells) store.cells = {};
  if (!store.margins) store.margins = {};
}
function save() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(store));
}

function autoGrow(el) {
  el.style.height = 'auto';
  el.style.height = el.scrollHeight + 'px';
}

// 居室を、左右の床数合計が最も均等になる位置で2列に分割
function splitRooms(rooms) {
  const total = rooms.reduce((s, r) => s + r.beds, 0);
  let best = rooms.length, bestDiff = Infinity, acc = 0;
  for (let i = 0; i < rooms.length; i++) {
    acc += rooms[i].beds;
    const diff = Math.abs(acc - (total - acc));
    if (diff < bestDiff) { bestDiff = diff; best = i + 1; }
  }
  return [rooms.slice(0, best), rooms.slice(best)];
}

// 1列分のテーブルHTML（号室は rowspan で結合、居室ごとに区切り線）
function colHtml(rooms) {
  let body = '';
  rooms.forEach(({ room, beds }) => {
    for (let i = 0; i < beds; i++) {
      const startCls = i === 0 ? ' class="room-start"' : '';
      const roomTd = i === 0
        ? `<td class="room-cell" rowspan="${beds}">${room}</td>`
        : '';
      body += `<tr${startCls}>
          ${roomTd}
          <td><input class="cell-input" type="text" data-room="${room}" data-ri="${i}" data-field="name"></td>
          <td><textarea class="cell-area" rows="1" data-room="${room}" data-ri="${i}" data-field="tx"></textarea></td>
        </tr>`;
    }
  });
  return `<table class="tx">
      <thead><tr>
        <th class="c-room">号室</th>
        <th class="c-name">名前</th>
        <th class="c-tx">処置</th>
      </tr></thead>
      <tbody>${body}</tbody>
    </table>`;
}

function sheetHtml(title, key, rooms) {
  const [left, right] = splitRooms(rooms);
  return `<div class="sheet">
    <div class="sheet-title">利用者別処置表　${title}</div>
    <div class="columns">
      <div class="col">${colHtml(left)}</div>
      <div class="col">${colHtml(right)}</div>
    </div>
    <div class="margin-row">
      <div class="margin-cell">
        <div class="margin-label">余白</div>
        <textarea class="margin-area" data-margin="${key}-L"></textarea>
      </div>
      <div class="margin-cell">
        <div class="margin-label">余白</div>
        <textarea class="margin-area" data-margin="${key}-R"></textarea>
      </div>
    </div>
  </div>`;
}

function render() {
  const container = document.getElementById('sheets');
  container.innerHTML =
    sheetHtml('2階', '200', FLOOR_200) +
    sheetHtml('3階', '300', FLOOR_300);

  // 値の流し込み（特殊文字対策で value は DOM 経由）＋高さ調整
  container.querySelectorAll('.cell-input, .cell-area').forEach(el => {
    const k = `${el.dataset.room}#${el.dataset.ri}#${el.dataset.field}`;
    el.value = store.cells[k] || '';
    if (el.tagName === 'TEXTAREA') autoGrow(el);
  });
  container.querySelectorAll('.margin-area').forEach(el => {
    el.value = store.margins[el.dataset.margin] || '';
    autoGrow(el);
  });

  bindEvents(container);
}

function bindEvents(container) {
  container.querySelectorAll('.cell-input, .cell-area').forEach(el => {
    el.addEventListener('input', () => {
      const k = `${el.dataset.room}#${el.dataset.ri}#${el.dataset.field}`;
      store.cells[k] = el.value;
      if (el.tagName === 'TEXTAREA') autoGrow(el);
      save();
    });
  });
  container.querySelectorAll('.margin-area').forEach(el => {
    el.addEventListener('input', () => {
      store.margins[el.dataset.margin] = el.value;
      autoGrow(el);
      save();
    });
  });
}

load();
render();
</script>
</body>
</html>
