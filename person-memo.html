<!DOCTYPE html>
<html lang="ja" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#7B6148">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>人物記録メモ</title>
  <link rel="icon" href="favicon.png">
  <link rel="icon_16kb" href="icon_16kb.png">
  <style>
    /* ===== CSS VARIABLES ===== */
    :root {
      --primary: #7B6148;
      --primary-dk: #6A5038;
      --primary-lt: #EDE6DB;
      --accent: #C4956A;
      --bg: #E8E3D8;
      --card: #F4EFE8;
      --hdr: #F4EFE8;
      --nav: #F4EFE8;
      --tx: #2C2218;
      --tx2: #786A5E;
      --txm: #ACA498;
      --bd: #D4CDC4;
      --sh: 0 1px 4px rgba(44,34,24,.07),0 1px 2px rgba(0,0,0,.04);
      --sh-lg: 0 4px 20px rgba(44,34,24,.12),0 2px 8px rgba(0,0,0,.06);
      --r: 18px;
      --rm: 12px;
      --rs: 8px;
      --tag-bg: #EAE4DA;
      --tag-cl: #7B6148;
      --per-bg: #F5EAE0;
      --per-cl: #9B5C38;
    }
    [data-theme="dark"] {
      --primary: #C4A880;
      --primary-dk: #B89A6C;
      --primary-lt: #2E2818;
      --bg: #1C1812;
      --card: #252018;
      --hdr: #201C14;
      --nav: #201C14;
      --tx: #EDE5D8;
      --tx2: #A89888;
      --txm: #786E60;
      --bd: #3C3428;
      --sh: 0 2px 12px rgba(0,0,0,.4),0 1px 4px rgba(0,0,0,.3);
      --sh-lg: 0 6px 28px rgba(0,0,0,.55);
      --tag-bg: #2A2418;
      --tag-cl: #C4A880;
      --per-bg: #2E1E14;
      --per-cl: #D4A070;
    }

    /* ===== RESET ===== */
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
    html{scroll-behavior:smooth;overscroll-behavior-y:none;}
    body{
      font-family:-apple-system,BlinkMacSystemFont,'Hiragino Sans','Hiragino Kaku Gothic ProN','YuGothic','Yu Gothic',sans-serif;
      background:var(--bg);color:var(--tx);min-height:100vh;overflow-x:hidden;
      transition:background .3s,color .3s;
      overscroll-behavior-y:none;
    }
    button{font-family:inherit;cursor:pointer}
    input,textarea{font-family:inherit}
    ::-webkit-scrollbar{width:4px}
    ::-webkit-scrollbar-thumb{background:var(--bd);border-radius:2px}

    /* ===== HEADER ===== */
    .app-header{
      position:fixed;top:0;left:0;right:0;height:56px;
      background:var(--hdr);border-bottom:1px solid var(--bd);
      display:flex;align-items:center;padding:0 16px;z-index:90;
      box-shadow:0 1px 8px rgba(0,0,0,.06);
    }
    .app-header h1{font-size:18px;font-weight:800;color:var(--primary);flex:1;letter-spacing:-.3px}
    .hdr-actions{display:flex;gap:8px}
    .icon-btn{
      width:36px;height:36px;border:none;background:var(--primary-lt);color:var(--primary);
      border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:16px;
      transition:transform .15s,opacity .2s;
    }
    .icon-btn:active{transform:scale(.9);opacity:.8}

    /* ===== MAIN ===== */
    .main-content{
      margin-top:56px;
      padding:14px 14px calc(64px + env(safe-area-inset-bottom,0px) + 14px);
      max-width:620px;margin-left:auto;margin-right:auto;
    }

    /* ===== BOTTOM NAV ===== */
    .bottom-nav{
      position:fixed;bottom:0;left:0;right:0;height:64px;
      background:var(--nav);border-top:1px solid var(--bd);
      display:flex;justify-content:space-around;align-items:center;
      padding-bottom:env(safe-area-inset-bottom,0);z-index:90;
      box-shadow:0 -2px 12px rgba(0,0,0,.06);
    }
    .nav-item{
      flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;
      padding:8px 0;border:none;background:none;color:var(--txm);
      transition:transform .15s,color .2s;
    }
    .nav-item.active{color:var(--primary)}
    .nav-item:active{transform:scale(.9)}
    .nav-icon{font-size:22px;line-height:1}
    .nav-label{font-size:10px;font-weight:700}

    /* ===== FAB ===== */
    .fab{
      position:fixed;right:20px;bottom:78px;
      width:56px;height:56px;background:var(--primary);color:#fff;
      border:none;border-radius:50%;font-size:26px;z-index:91;
      display:flex;align-items:center;justify-content:center;
      box-shadow:0 4px 20px rgba(123,97,72,.4);
      transition:transform .2s,box-shadow .2s;
    }
    .fab:active{transform:scale(.92);box-shadow:0 2px 10px rgba(123,97,72,.25)}

    /* ===== MEMO CARD ===== */
    @keyframes fadeUp{
      from{opacity:0;transform:translateY(10px)}
      to{opacity:1;transform:translateY(0)}
    }
    .memo-card{
      background:var(--card);
      border-radius:10px;
      border:1px solid var(--bd);
      border-left:4px solid var(--primary);
      box-shadow:0 1px 4px rgba(0,0,0,.05);
      margin-bottom:10px;
      overflow:hidden;
      cursor:pointer;
      animation:fadeUp .3s ease both;
      transition:box-shadow .15s,transform .15s;
    }
    .memo-card:active{transform:scale(.99);box-shadow:0 1px 2px rgba(0,0,0,.04)}
    .memo-date-bar{
      display:flex;align-items:center;justify-content:space-between;
      padding:9px 12px 8px;
      background:var(--bg);
      border-bottom:1px solid var(--bd);
    }
    .memo-date-text{
      font-size:13px;font-weight:700;color:var(--tx2);letter-spacing:.1px;
    }
    .memo-edit-btn{
      width:28px;height:28px;border:none;background:none;
      color:var(--txm);font-size:15px;line-height:1;
      border-radius:6px;
      display:flex;align-items:center;justify-content:center;
      transition:background .15s,color .15s;flex-shrink:0;
    }
    .memo-edit-btn:active{background:var(--bd);color:var(--primary)}
    .memo-body-area{padding:10px 12px 12px;}
    .memo-people{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px;}
    .memo-person-chip{
      display:inline-flex;align-items:center;gap:3px;
      font-size:12px;font-weight:600;
      color:var(--per-cl);background:var(--per-bg);
      padding:3px 9px;border-radius:20px;border:none;
      transition:transform .15s;
    }
    .memo-person-chip:active{transform:scale(.93)}
    .memo-text{
      font-size:14px;line-height:1.85;color:var(--tx);
      word-break:break-word;white-space:pre-wrap;
      margin-bottom:8px;
    }
    .memo-tags{display:flex;flex-wrap:wrap;gap:5px;}
    .memo-tag-chip{
      display:inline-flex;align-items:center;
      font-size:11px;font-weight:700;
      padding:2px 8px;border-radius:4px;
      background:var(--tag-bg);color:var(--tag-cl);
      border:1px solid var(--bd);
      cursor:pointer;transition:transform .15s;
    }
    .memo-tag-chip:active{transform:scale(.93)}

    /* ===== TOOLBAR ===== */
    .toolbar{display:flex;align-items:center;gap:8px;margin-bottom:12px}
    .sort-btn{
      padding:6px 14px;border-radius:20px;border:2px solid var(--bd);
      background:var(--card);color:var(--tx2);font-size:12px;font-weight:700;
      transition:all .2s;
    }
    .sort-btn.active{border-color:var(--primary);background:var(--primary-lt);color:var(--primary)}
    .count-badge{margin-left:auto;font-size:12px;color:var(--txm);font-weight:600}

    /* ===== SEARCH ===== */
    .search-input{
      width:100%;padding:12px 16px;border-radius:var(--rm);
      border:2px solid var(--bd);background:var(--card);
      color:var(--tx);font-size:14px;outline:none;margin-bottom:12px;
      transition:border-color .2s;
    }
    .search-input:focus{border-color:var(--primary)}
    .filter-card{
      background:var(--card);border-radius:var(--r);box-shadow:var(--sh);
      padding:14px 16px;margin-bottom:12px;border:1px solid var(--bd);
    }
    .filter-title{font-size:11px;font-weight:800;color:var(--txm);text-transform:uppercase;letter-spacing:.8px;margin-bottom:10px}
    .chip-row{display:flex;flex-wrap:wrap;gap:6px}
    .filter-chip{
      padding:6px 12px;border-radius:20px;border:2px solid var(--bd);
      background:var(--card);color:var(--tx2);font-size:12px;font-weight:700;
      transition:all .2s;
    }
    .filter-chip.active{border-color:var(--primary);background:var(--primary-lt);color:var(--primary)}
    .date-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
    .date-inp{
      padding:9px 12px;border-radius:var(--rs);border:2px solid var(--bd);
      background:var(--bg);color:var(--tx);font-size:13px;outline:none;
      width:100%;transition:border-color .2s;
    }
    .date-inp:focus{border-color:var(--primary)}

    /* ===== CALENDAR ===== */
    .cal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
    .cal-month-title{font-size:18px;font-weight:800}
    .cal-nav{
      width:36px;height:36px;border:none;background:var(--primary-lt);color:var(--primary);
      border-radius:10px;font-size:20px;font-weight:700;
      display:flex;align-items:center;justify-content:center;transition:transform .15s;
    }
    .cal-nav:active{transform:scale(.9)}
    .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
    .cal-dow{text-align:center;font-size:10px;font-weight:800;color:var(--txm);padding:4px 0;letter-spacing:.3px}
    .cal-day{
      aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
      border-radius:10px;font-size:13px;font-weight:600;
      position:relative;transition:background .15s,transform .15s;cursor:pointer;
    }
    .cal-day:active{transform:scale(.88)}
    .cal-day.other{color:var(--txm);opacity:.35;pointer-events:none}
    .cal-day.today{background:var(--primary-lt);color:var(--primary);font-weight:800}
    .cal-day.has-rec::after{
      content:'';position:absolute;bottom:3px;width:5px;height:5px;
      background:var(--primary);border-radius:50%;
    }
    .cal-day.sel{background:var(--primary)!important;color:#fff!important}
    .cal-day.sel::after{background:rgba(255,255,255,.75)}
    .cal-sel-label{font-size:13px;font-weight:700;color:var(--tx2);margin:14px 0 10px}

    /* ===== PEOPLE ===== */
    .person-card{
      background:var(--card);border-radius:var(--r);box-shadow:var(--sh);
      padding:14px 16px;margin-bottom:10px;
      display:flex;align-items:center;gap:12px;cursor:pointer;
      border:1px solid var(--bd);transition:transform .15s,box-shadow .2s;
      animation:fadeUp .25s ease both;
    }
    .person-card:active{transform:scale(.98)}
    .p-icon{
      width:46px;height:46px;border-radius:50%;background:var(--primary-lt);
      display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0;
    }
    .p-info{flex:1;min-width:0}
    .p-name{font-size:15px;font-weight:800;margin-bottom:2px}
    .p-memo{font-size:12px;color:var(--txm);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .p-count{
      font-size:11px;font-weight:800;color:var(--primary);
      background:var(--primary-lt);padding:4px 10px;border-radius:20px;flex-shrink:0;
    }
    .p-sns{display:flex;gap:6px;margin-top:4px;flex-wrap:wrap}
    .p-sns-link{text-decoration:none;font-size:16px}
    .p-group-badge{display:inline-block;font-size:11px;font-weight:800;background:var(--primary-lt);color:var(--primary);padding:2px 8px;border-radius:20px;}
    .p-contact-row{display:flex;align-items:center;gap:8px;margin-top:3px;flex-wrap:wrap;}
    .p-last-contact{font-size:11px;color:var(--txm);font-weight:600;}

    /* ===== MODAL ===== */
    .modal-overlay{
      position:fixed;inset:0;background:rgba(0,0,0,.55);
      backdrop-filter:blur(3px);z-index:200;
      display:flex;align-items:flex-end;
      opacity:0;pointer-events:none;transition:opacity .25s ease;
    }
    .modal-overlay.open{opacity:1;pointer-events:all}
    .modal{
      background:var(--card);border-radius:var(--r) var(--r) 0 0;
      width:100%;max-height:93vh;overflow-y:auto;
      padding:0 20px 40px;
      transform:translateY(100%);transition:transform .3s cubic-bezier(.32,.72,0,1);
    }
    .modal-overlay.open .modal{transform:translateY(0)}
    .modal-handle{width:40px;height:4px;background:var(--bd);border-radius:2px;margin:12px auto 18px}
    .modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
    .modal-title{font-size:18px;font-weight:800}
    .close-btn{
      width:32px;height:32px;border:none;background:var(--bd);
      color:var(--txm);border-radius:50%;font-size:18px;
      display:flex;align-items:center;justify-content:center;transition:transform .15s;
    }
    .close-btn:active{transform:scale(.9)}

    /* ===== FORM ===== */
    .form-group{margin-bottom:18px}
    .form-label{
      display:block;font-size:11px;font-weight:800;color:var(--txm);
      text-transform:uppercase;letter-spacing:.7px;margin-bottom:8px;
    }
    .form-input{
      width:100%;padding:12px 14px;border-radius:var(--rm);
      border:2px solid var(--bd);background:var(--bg);color:var(--tx);
      font-size:15px;outline:none;transition:border-color .2s;
    }
    .form-input:focus{border-color:var(--primary)}
    .form-textarea{
      width:100%;padding:12px 14px;border-radius:var(--rm);
      border:2px solid var(--bd);background:var(--bg);color:var(--tx);
      font-size:15px;outline:none;transition:border-color .2s;
      resize:vertical;min-height:80px;line-height:1.65;
    }
    .form-textarea:focus{border-color:var(--primary)}
    /* Memo-app ruled textarea */
    .memo-textarea{
      font-size:15px;line-height:28px;
      padding-top:8px;padding-bottom:8px;
      background-image:repeating-linear-gradient(
        to bottom,
        transparent,
        transparent 27px,
        var(--bd) 27px,
        var(--bd) 28px
      );
      background-attachment:local;
    }

    /* Tag input */
    .tag-field{
      border:2px solid var(--bd);border-radius:var(--rm);
      background:var(--bg);padding:8px;display:flex;flex-wrap:wrap;
      gap:6px;min-height:50px;cursor:text;transition:border-color .2s;
    }
    .tag-field:focus-within{border-color:var(--primary)}
    .ti-chip{
      display:inline-flex;align-items:center;gap:4px;
      background:var(--tag-bg);color:var(--tag-cl);
      padding:4px 10px;border-radius:20px;font-size:12px;font-weight:800;
    }
    .ti-chip button{border:none;background:none;color:inherit;font-size:15px;line-height:1;opacity:.7;padding:0}
    .ti-text{
      border:none;background:none;outline:none;font-size:14px;
      color:var(--tx);flex:1;min-width:80px;padding:4px;
    }

    /* Person select */
    .psel-row{display:flex;flex-wrap:wrap;gap:8px}
    .psel-chip{
      padding:8px 14px;border-radius:20px;border:2px solid var(--bd);
      background:var(--card);color:var(--tx2);font-size:13px;font-weight:700;
      transition:all .2s;
    }
    .psel-chip.sel{border-color:var(--per-cl);background:var(--per-bg);color:var(--per-cl)}
    .add-per-btn{
      margin-top:8px;padding:7px 14px;border-radius:20px;
      border:none;background:var(--primary-lt);color:var(--primary);
      font-size:12px;font-weight:800;display:inline-block;
    }
    .add-per-btn:active{opacity:.8}

    /* Icon picker */
    .icon-grid{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
    .icon-opt{
      width:44px;height:44px;border:2px solid var(--bd);border-radius:10px;
      background:var(--bg);font-size:22px;
      display:flex;align-items:center;justify-content:center;transition:all .15s;
    }
    .icon-opt.sel{border-color:var(--primary);background:var(--primary-lt)}
    .icon-opt:active{transform:scale(.88)}

    /* ===== LINK INPUT ===== */
    .link-list{display:flex;flex-direction:column;gap:8px}
    .link-row{display:flex;gap:6px;align-items:center}
    .link-label-inp{
      width:88px;flex-shrink:0;padding:10px 10px;border-radius:var(--rs);
      border:2px solid var(--bd);background:var(--bg);color:var(--tx);
      font-size:13px;outline:none;transition:border-color .2s;
    }
    .link-label-inp:focus{border-color:var(--primary)}
    .link-url-inp{
      flex:1;padding:10px 12px;border-radius:var(--rs);
      border:2px solid var(--bd);background:var(--bg);color:var(--tx);
      font-size:13px;outline:none;transition:border-color .2s;min-width:0;
    }
    .link-url-inp:focus{border-color:var(--primary)}
    .link-del-btn{
      width:30px;height:30px;flex-shrink:0;border:none;background:none;
      color:#E03030;font-size:18px;border-radius:6px;
      display:flex;align-items:center;justify-content:center;
      transition:background .15s;
    }
    .link-del-btn:active{background:rgba(224,48,48,.1)}
    .add-link-btn{
      margin-top:6px;padding:8px 14px;border-radius:20px;border:none;
      background:var(--primary-lt);color:var(--primary);font-size:12px;font-weight:800;
      transition:opacity .15s;
    }
    .add-link-btn:active{opacity:.7}

    /* ===== PERSON DETAIL LINKS ===== */
    .pd-links{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:4px 0 16px}
    .pd-link-chip{
      display:inline-flex;align-items:center;gap:6px;
      padding:8px 16px;border-radius:20px;
      background:var(--primary-lt);color:var(--primary);
      font-size:13px;font-weight:700;text-decoration:none;
      border:2px solid transparent;transition:border-color .15s,transform .15s;
    }
    .pd-link-chip:active{transform:scale(.95);border-color:var(--primary)}

    /* Buttons */
    .btn-primary{
      width:100%;padding:15px;background:var(--primary);color:#fff;
      border:none;border-radius:var(--rm);font-size:16px;font-weight:800;
      box-shadow:0 4px 16px rgba(123,97,72,.3);transition:transform .15s,box-shadow .2s;
      margin-top:6px;
    }
    .btn-primary:active{transform:scale(.97);box-shadow:0 2px 8px rgba(123,97,72,.18)}
    .btn-danger{
      width:100%;padding:13px;background:transparent;color:#E03030;
      border:2px solid #E03030;border-radius:var(--rm);font-size:14px;font-weight:800;
      margin-top:8px;transition:transform .15s,background .2s;
    }
    .btn-danger:active{transform:scale(.97);background:rgba(224,48,48,.06)}
    .btn-sec{
      padding:10px;background:var(--primary-lt);color:var(--primary);
      border:none;border-radius:var(--rs);font-size:13px;font-weight:800;
      transition:transform .15s;
    }
    .btn-sec:active{transform:scale(.95)}
    .btn-pri{
      padding:8px 16px;background:var(--primary);color:#fff;
      border:none;border-radius:var(--rs);font-size:13px;font-weight:800;
      transition:transform .15s,opacity .2s;
    }
    .btn-pri:active{transform:scale(.95);opacity:.9}
    .icon-btn-danger{
      width:36px;height:36px;border:none;
      background:rgba(224,48,48,.1);color:#E03030;
      border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:16px;
      transition:transform .15s,opacity .2s;
    }
    .icon-btn-danger:active{transform:scale(.9);opacity:.8}

    /* ===== PERSON DETAIL ===== */
    .pd-header{text-align:center;padding:20px 0 16px}
    .pd-icon{
      width:72px;height:72px;border-radius:50%;background:var(--primary-lt);
      display:flex;align-items:center;justify-content:center;font-size:36px;margin:0 auto 12px;
    }
    .pd-name{font-size:22px;font-weight:800;margin-bottom:4px}
    .pd-memo{font-size:13px;color:var(--txm);margin-bottom:8px}
    .pd-stats{display:flex;justify-content:center;gap:28px;margin:10px 0}
    .stat{text-align:center}
    .stat-n{font-size:26px;font-weight:800;color:var(--primary);line-height:1}
    .stat-l{font-size:11px;color:var(--txm);margin-top:2px}

    /* ===== CONTEXT MENU ===== */
    .ctx-menu{
      position:fixed;background:var(--card);border-radius:var(--rm);
      box-shadow:var(--sh-lg);border:1px solid var(--bd);
      z-index:400;min-width:140px;overflow:hidden;
      opacity:0;transform:scale(.88);pointer-events:none;
      transition:opacity .15s,transform .15s;transform-origin:top right;
    }
    .ctx-menu.open{opacity:1;transform:scale(1);pointer-events:all}
    .ctx-item{
      padding:12px 16px;font-size:14px;font-weight:600;
      display:flex;align-items:center;gap:10px;
      transition:background .15s;border:none;
      background:none;width:100%;text-align:left;color:var(--tx);
    }
    .ctx-item:active{background:var(--bd)}
    .ctx-item.danger{color:#E03030}

    /* ===== DATA MODAL ===== */
    .data-sec{background:var(--bg);border-radius:var(--rm);padding:14px;margin-bottom:12px}
    .data-sec-title{font-size:12px;font-weight:800;color:var(--tx2);margin-bottom:10px}
    .data-btn-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}

    /* ===== EMPTY STATE ===== */
    .empty{text-align:center;padding:56px 20px;color:var(--txm)}
    .empty-icon{font-size:48px;margin-bottom:12px}
    .empty p{font-size:14px;line-height:1.7}

    /* ===== TOAST ===== */
    .toast{
      position:fixed;bottom:86px;left:50%;
      transform:translateX(-50%) translateY(10px);
      background:var(--tx);color:var(--card);
      padding:9px 20px;border-radius:20px;font-size:13px;font-weight:700;
      z-index:600;opacity:0;transition:opacity .2s,transform .2s;
      pointer-events:none;white-space:nowrap;
    }
    .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

    /* ===== SCROLL TOP ===== */
    .scroll-top{
      position:fixed;bottom:142px;right:20px;
      width:38px;height:38px;background:var(--card);
      border:1px solid var(--bd);border-radius:50%;font-size:16px;
      box-shadow:var(--sh);z-index:89;color:var(--tx2);
      display:none;align-items:center;justify-content:center;transition:transform .15s;
    }
    .scroll-top.vis{display:flex}
    .scroll-top:active{transform:scale(.9)}

    /* ===== MODE TABS ===== */
    .mode-tabs{display:flex;gap:8px;margin-bottom:14px;background:var(--card);padding:10px 12px;border-radius:var(--r);box-shadow:var(--sh);border:1px solid var(--bd);}
    .mode-tab{flex:1;padding:8px 0;border-radius:20px;border:2px solid var(--bd);background:var(--card);color:var(--tx2);font-size:13px;font-weight:700;transition:all .2s;}
    .mode-tab.active{border-color:var(--primary);background:var(--primary-lt);color:var(--primary);}
    .mode-tab:active{transform:scale(.95)}

    /* ===== VIEWS ===== */
    .view{display:none}
    .view.active{display:block}

    /* ===== RESPONSIVE ===== */
    @media(min-width:640px){
      .main-content{padding:20px}
      .modal{max-width:580px;margin:auto 0;border-radius:var(--r)}
      .modal-overlay{align-items:center}
    }
  </style>
</head>

    </div>
  </div>

<input type="file" id="fileInput" accept=".json" style="display:none" onchange="importJSON(event)">

<!-- SCRIPT -->
<script>
'use strict';

// ─── STATE ───────────────────────────────────────────────────
var db = { records: [], people: [], settings: { theme: 'light' } };
var curView    = 'home';
var curMode    = 'hobby';
var curSort    = 'newest';
var editRecId  = null;
var editPerId  = null;
var ctxRecId   = null;
var fromRec    = false;
var calYear    = new Date().getFullYear();
var calMonth   = new Date().getMonth();
var calSelDate = null;
var selPeople  = [];
var selTags    = [];
var selLinks   = [];   // [{ label:'', url:'' }]
var selIcon    = '👤';
var sf = { kw: '', personIds: [], tags: [], from: '', to: '' };
var personFilter = 'all';
var personSort   = 'lastContact_desc';
var selGroup     = 'その他';

var ICONS = [
  '👤','👨','👩','👴','👵','👦','👧','🧑',
  '👨‍💼','👩‍💼','👨‍🎓','👩‍🎓','👨‍🍳','👩‍🍳','👨‍🎨','👩‍🎨',
  '🧔','👱','😀','🙂','😎','🤓','🥸','🤩',
  '🌟','⭐','🔥','💎','🌈','🎵','🐶','🐱',
];

// ─── STORAGE ─────────────────────────────────────────────────
function loadDB() {
  try {
    var s = localStorage.getItem('hanecat_memo_v1');
    if (s) {
      db = JSON.parse(s);
      db.settings = db.settings || { theme: 'light' };
      db.records.forEach(function(r){ if (!r.mode) r.mode = 'hobby'; });
      db.groups = db.groups || ['家族','友人','仕事','趣味','その他'];
      db.people.forEach(function(p){
        if (!p.group) p.group = 'その他';
        if (p.lastContactDate === undefined) p.lastContactDate = '';
      });
    }
  } catch(e) {}
}
function saveDB() {
  try { localStorage.setItem('hanecat_memo_v1', JSON.stringify(db)); } catch(e) {}
}

// ─── JSON IO ─────────────────────────────────────────────────
function exportJSON() {
  var blob = new Blob([JSON.stringify(db, null, 2)], { type: 'application/json' });
  var url  = URL.createObjectURL(blob);
  var a    = document.createElement('a');
  a.href = url;
  a.download = 'person-memo-' + today() + '.json';
  a.click();
  URL.revokeObjectURL(url);
  toast('エクスポートしました');
  closeModal('dataModal');
}
function importJSON(e) {
  var f = e.target.files[0];
  if (!f) return;
  var r = new FileReader();
  r.onload = function(ev) {
    try {
      var d = JSON.parse(ev.target.result);
      if (d.records && d.people) {
        db = d;
        db.settings = db.settings || { theme: 'light' };
        saveDB(); applyTheme(); refresh();
        toast('インポートしました');
        closeModal('dataModal');
      } else {
        toast('無効なファイル形式です');
      }
    } catch(err) {
      toast('読み込みに失敗しました');
    }
  };
  r.readAsText(f);
  e.target.value = '';
}
function clearAll() {
  if (!confirm('全データを削除しますか？\nこの操作は取り消せません。')) return;
  db = { records: [], people: [], settings: db.settings };
  saveDB(); refresh();
  toast('削除しました');
  closeModal('dataModal');
}

// ─── THEME ───────────────────────────────────────────────────
function applyTheme() {
  var t = (db.settings && db.settings.theme) || 'light';
  document.documentElement.setAttribute('data-theme', t);
  document.getElementById('themeBtn').textContent = t === 'dark' ? '☀️' : '🌙';
}
function toggleTheme() {
  db.settings.theme = db.settings.theme === 'dark' ? 'light' : 'dark';
  saveDB(); applyTheme();
}
function setTheme(t) {
  db.settings.theme = t;
  saveDB(); applyTheme();
  closeModal('dataModal');
}

// ─── UTILS ───────────────────────────────────────────────────
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2); }
function today() { return new Date().toISOString().slice(0, 10); }
function fmtDate(d) {
  if (!d) return '';
  var p = d.split('-');
  return p[0] + '/' + p[1] + '/' + p[2];
}
function fmtDateLong(d) {
  if (!d) return '';
  var p = d.split('-');
  var dt = new Date(+p[0], +p[1]-1, +p[2]);
  var days = ['日','月','火','水','木','金','土'];
  return p[0] + '年' + (+p[1]) + '月' + (+p[2]) + '日（' + days[dt.getDay()] + '）';
}
function getPerson(id) {
  for (var i = 0; i < db.people.length; i++) { if (db.people[i].id === id) return db.people[i]; }
  return null;
}
function getRec(id) {
  for (var i = 0; i < db.records.length; i++) { if (db.records[i].id === id) return db.records[i]; }
  return null;
}
function allTags() {
  var s = {};
  db.records.filter(function(r){ return (r.mode||'hobby') === curMode; })
    .forEach(function(r){ (r.tags||[]).forEach(function(t){ s[t]=1; }); });
  return Object.keys(s).sort();
}
function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function toast(msg) {
  var el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(el._t);
  el._t = setTimeout(function(){ el.classList.remove('show'); }, 2400);
}

// ─── SNS ICON ────────────────────────────────────────────────
function snsIcon(url) {
  if (!url) return '🔗';
  var u = url.toLowerCase();
  if (u.indexOf('twitter.com') >= 0 || u.indexOf('x.com') >= 0) return '🐦';
  if (u.indexOf('instagram.com') >= 0) return '📷';
  if (u.indexOf('facebook.com') >= 0) return '👍';
  if (u.indexOf('youtube.com') >= 0 || u.indexOf('youtu.be') >= 0) return '▶️';
  if (u.indexOf('tiktok.com') >= 0) return '🎵';
  if (u.indexOf('linkedin.com') >= 0) return '💼';
  if (u.indexOf('github.com') >= 0) return '💻';
  if (u.indexOf('note.com') >= 0) return '📝';
  if (u.indexOf('threads.net') >= 0) return '🧵';
  if (u.indexOf('line.me') >= 0 || u.indexOf('line.naver') >= 0) return '💬';
  return '🔗';
}
function snsLabel(lk) {
  if (lk.label) return lk.label;
  try {
    var h = new URL(lk.url).hostname.replace(/^www\./, '');
    return h.split('.')[0];
  } catch(e) { return lk.url; }
}

// ─── MODAL ───────────────────────────────────────────────────
function openModal(id) { document.getElementById(id).classList.add('open'); }
function closeModal(id) { document.getElementById(id).classList.remove('open'); }
function overlayClose(e, id) { if (e.target.id === id) closeModal(id); }

// ─── NAVIGATION ──────────────────────────────────────────────
function cap(s) { return s.charAt(0).toUpperCase() + s.slice(1); }
function showView(v) {
  document.querySelectorAll('.view').forEach(function(el){ el.classList.remove('active'); });
  document.querySelectorAll('.nav-item').forEach(function(el){ el.classList.remove('active'); });
  document.getElementById('view' + cap(v)).classList.add('active');
  document.getElementById('nav' + cap(v)).classList.add('active');
  curView = v;

  var titles = { home: '📝 人物記録メモ', search: '🔍 検索', calendar: '📅 カレンダー', people: '👥 人物' };
  document.getElementById('headerTitle').textContent = titles[v] || '';

  var fab = document.getElementById('fab');
  fab.style.display = 'flex';
  fab.onclick = v === 'people' ? openAddPerson : openAddRecord;
  document.getElementById('modeTabs').style.display = v === 'people' ? 'none' : 'flex';

  window.scrollTo({ top: 0 });
  refresh();
}
function setMode(m) {
  curMode = m;
  db.settings.mode = m; saveDB();
  var tabs = { hobby: 'modeTabHobby', work: 'modeTabWork', quick: 'modeTabQuick' };
  document.querySelectorAll('.mode-tab').forEach(function(el){ el.classList.remove('active'); });
  document.getElementById(tabs[m]).classList.add('active');
  sf = { kw: '', personIds: [], tags: [], from: '', to: '' };
  var kw = document.getElementById('searchKw'); if(kw) kw.value = '';
  var df = document.getElementById('dateFrom'); if(df) df.value = '';
  var dt = document.getElementById('dateTo');   if(dt) dt.value = '';
  refresh();
}
function refresh() {
  if (curView === 'home')     renderHome();
  if (curView === 'search')   renderSearch();
  if (curView === 'calendar') renderCalendar();
  if (curView === 'people')   renderPeople();
}

// ─── SORT ────────────────────────────────────────────────────
function setSort(s) {
  curSort = s;
  document.getElementById('sortNewest').classList.toggle('active', s === 'newest');
  document.getElementById('sortOldest').classList.toggle('active', s === 'oldest');
  renderHome();
}
function sorted(arr) {
  return arr.slice().sort(function(a, b) {
    var c = a.date < b.date ? -1 : a.date > b.date ? 1 : 0;
    return curSort === 'newest' ? -c : c;
  });
}

// ─── CARD HTML ───────────────────────────────────────────────
function cardHTML(rec, delay) {
  delay = delay || 0;
  var people = (rec.peopleIds || []).map(getPerson).filter(Boolean);
  var peopleHTML = people.map(function(p){
    return '<button class="memo-person-chip" onclick="onPersonChip(\'' + p.id + '\',event)">👤 ' + esc(p.name) + '</button>';
  }).join('');
  var tagsHTML = (rec.tags || []).map(function(t){
    return '<button class="memo-tag-chip" onclick="onTagChip(\'' + esc(t) + '\',event)">#' + esc(t) + '</button>';
  }).join('');
  var bodyParts = '';
  if (people.length) bodyParts += '<div class="memo-people">' + peopleHTML + '</div>';
  if (rec.memo)      bodyParts += '<div class="memo-text">' + esc(rec.memo) + '</div>';

// ─── CALENDAR ────────────────────────────────────────────────
function renderCalendar() {
  document.getElementById('calMonthLabel').textContent = calYear + '年' + (calMonth+1) + '月';
  var recDates = {};
  db.records.filter(function(r){ return (r.mode||'hobby') === curMode; }).forEach(function(r){ recDates[r.date] = true; });
  var todayStr = today();
  var dow  = ['日','月','火','水','木','金','土'];
  var fd   = new Date(calYear, calMonth, 1).getDay();
  var last = new Date(calYear, calMonth+1, 0).getDate();
  var prevLast = new Date(calYear, calMonth, 0).getDate();

  var html = dow.map(function(d){ return '<div class="cal-dow">' + d + '</div>'; }).join('');
  for (var i = fd-1; i >= 0; i--)
    html += '<div class="cal-day other">' + (prevLast-i) + '</div>';
  for (var d = 1; d <= last; d++) {
    var mm = (calMonth+1) < 10 ? '0'+(calMonth+1) : ''+(calMonth+1);
    var dd = d < 10 ? '0'+d : ''+d;
    var ds = calYear + '-' + mm + '-' + dd;
    var cls = 'cal-day';
    if (ds === todayStr)   cls += ' today';
    if (recDates[ds])      cls += ' has-rec';
    if (ds === calSelDate) cls += ' sel';
    html += '<div class="' + cls + '" onclick="calSelect(\'' + ds + '\')">' + d + '</div>';
  }
  var rem = (7 - ((fd + last) % 7)) % 7;
  for (var d2 = 1; d2 <= rem; d2++)
    html += '<div class="cal-day other">' + d2 + '</div>';

  document.getElementById('calGrid').innerHTML = html;
  renderCalDayRecs();
}
function calPrev() { calMonth--; if (calMonth < 0) { calMonth=11; calYear--; } renderCalendar(); }
function calNext() { calMonth++; if (calMonth > 11) { calMonth=0; calYear++; } renderCalendar(); }
function calSelect(ds) { calSelDate = ds; renderCalendar(); }
function renderCalDayRecs() {
  if (!calSelDate) {
    document.getElementById('calSelLabel').textContent = '日付を選択してください';
    document.getElementById('calDayRecords').innerHTML = '';
    return;
  }
  var recs = sorted(db.records.filter(function(r){ return r.date === calSelDate && (r.mode||'hobby') === curMode; }));
  document.getElementById('calSelLabel').textContent =
    '📅 ' + fmtDate(calSelDate) + ' の記録（' + recs.length + '件）';
  var c = document.getElementById('calDayRecords');
  c.innerHTML = recs.length
    ? recs.map(function(r,i){ return cardHTML(r,i); }).join('')
    : '<div style="text-align:center;padding:20px;font-size:13px;color:var(--txm);">記録はありません</div>';
}

function setPersonSort(s) {

  document.querySelectorAll('#pSortLCD,#pSortLCA,#pSortName').forEach(function(el){ el.classList.remove('active'); });
  var ids = { lastContact_desc:'pSortLCD', lastContact_asc:'pSortLCA', name:'pSortName' };

function sortedPeople(arr) {

    if (personSort === 'name') return a.name.localeCompare(b.name, 'ja');

    if (da === db2) return a.name.localeCompare(b.name, 'ja');
    if (personSort === 'lastContact_desc') return da > db2 ? -1 : 1;
    return da < db2 ? -1 : 1;
  });

  renderPselGrid();

function renderTagChips() {
  var c = document.getElementById('tagField');
  c.innerHTML = '';
  selTags.forEach(function(t){
    var span = document.createElement('span');
    span.className = 'ti-chip';
    span.innerHTML = '#' + esc(t) + ' <button onclick="removeTag(\'' + esc(t) + '\')">×</button>';
    c.appendChild(span);
  });
  var inp = document.createElement('input');
  inp.className = 'ti-text';
  inp.id = 'tagInput';
  inp.placeholder = selTags.length ? '' : '#タグを入力...';
  inp.onkeydown  = tagKeydown;
  inp.oninput    = tagInputChange;
  c.appendChild(inp);
}
function focusTagInput() { var el = document.getElementById('tagInput'); if(el) el.focus(); }
function tagKeydown(e) {
  var v = e.target.value;
  if (e.key === 'Enter' || e.key === 'Tab') {
    e.preventDefault(); flushTag(v);
  } else if ((e.key === ' ' || e.key === '　') && v.trim()) {
    e.preventDefault(); flushTag(v);
  } else if (e.key === 'Backspace' && v === '' && selTags.length) {
    selTags.pop(); renderTagChips();
  }
}
function tagInputChange(e) {
  var v = e.target.value;
  if (v.slice(-1) === ',' || v.slice(-1) === '、') flushTag(v.slice(0,-1));
}
function flushTag(raw) {
  var t = raw.trim().replace(/^#/, '');
  if (t && selTags.indexOf(t) < 0) selTags.push(t);
  renderTagChips();
  setTimeout(function(){ var el = document.getElementById('tagInput'); if(el) el.focus(); }, 0);
}
function removeTag(t) {
  var i = selTags.indexOf(t);
  if (i >= 0) selTags.splice(i, 1);
  renderTagChips();
}
function recalcLastContact() {
  db.people.forEach(function(p){ p.lastContactDate = ''; });
  db.records.forEach(function(r){
    if ((r.mode||'hobby') !== 'hobby') return;
    (r.peopleIds||[]).forEach(function(pid){
      var p = getPerson(pid);
      if (p && (!p.lastContactDate || r.date > p.lastContactDate)) p.lastContactDate = r.date;
    });
  });
}
function saveRecord() {
  var inp = document.getElementById('tagInput');
  if (inp && inp.value.trim()) flushTag(inp.value);
  var date = document.getElementById('recDate').value;
  if (!date) { toast('日付を入力してください'); return; }
  var memo = document.getElementById('recMemo').value.trim();
  var now  = new Date().toISOString();
  if (editRecId) {
    var r = getRec(editRecId);
    var rm = r.mode || 'hobby';
    r.date = date; r.memo = memo;
    if (rm === 'hobby') r.peopleIds = selPeople.slice();
    if (rm !== 'quick') r.tags = selTags.slice();
    r.updatedAt = now;
  } else {
    db.records.push({ id:uid(), mode:curMode, date:date, memo:memo, peopleIds:curMode==='hobby'?selPeople.slice():[], tags:curMode!=='quick'?selTags.slice():[], createdAt:now, updatedAt:now });
  }
  if (curMode === 'hobby') recalcLastContact();
  saveDB(); closeModal('recordModal'); refresh();
  toast(editRecId ? '更新しました' : '保存しました');
}
function deleteCurrentRec() {
  if (!editRecId || !confirm('この記録を削除しますか？')) return;
  db.records = db.records.filter(function(r){ return r.id !== editRecId; });
  recalcLastContact();
  saveDB(); closeModal('recordModal'); refresh(); toast('削除しました');
}

function renameGroup(idx, newName) {
  var oldName = db.groups[idx];
  db.groups[idx] = newName;
  db.people.forEach(function(p){ if (p.group === oldName) p.group = newName; });
  if (selGroup === oldName) selGroup = newName;
  if (personFilter === oldName) personFilter = newName;
  saveDB();
  renderGroupFilterChips();

function deleteGroup(idx) {
  var name = db.groups[idx];
  var inUse = db.people.some(function(p){ return p.group === name; });
  if (inUse) { toast(name + ' は使用中のため削除できません'); return; }
  db.groups.splice(idx, 1);
  if (selGroup === name) selGroup = db.groups[0] || 'その他';
  if (personFilter === name) { personFilter = 'all'; }
  saveDB();
  renderGroupEditList();
  renderGroupFilterChips();

  var c = document.getElementById('linkList');
  if (!selLinks.length) { c.innerHTML = ''; return; }
  c.innerHTML = selLinks.map(function(lk, i){
    return '<div class="link-row">'
      + '<input class="link-label-inp" type="text" placeholder="Twitter" value="' + esc(lk.label) + '" oninput="selLinks[' + i + '].label=this.value">'
      + '<input class="link-url-inp" type="url" placeholder="https://..." value="' + esc(lk.url) + '" oninput="selLinks[' + i + '].url=this.value">'
      + '<button class="link-del-btn" onclick="removeLinkRow(' + i + ')">×</button>'
      + '</div>';
  }).join('');
}
function addLinkRow() {
  selLinks.push({ label: '', url: '' });
  renderLinkList();
  setTimeout(function(){
    var inputs = document.querySelectorAll('.link-url-inp');
    if (inputs.length) inputs[inputs.length-1].focus();
  }, 50);
}
function removeLinkRow(i) {
  selLinks.splice(i, 1);
  renderLinkList();
}

function savePerson() {
  var name = document.getElementById('pName').value.trim();
  if (!name) { toast('名前を入力してください'); return; }
  var now = new Date().toISOString();
  var pid;
  var cleanLinks = selLinks.filter(function(lk){ return lk.url.trim(); });
  if (editPerId) {
    var p = getPerson(editPerId);
    p.name = name; p.icon = selIcon; p.group = selGroup;
    p.memo = document.getElementById('pMemo').value.trim();
    p.links = cleanLinks;
    p.updatedAt = now;
    pid = editPerId;
  } else {
    pid = uid();
    db.people.push({ id:pid, name:name, icon:selIcon, group:selGroup, memo:document.getElementById('pMemo').value.trim(), links:cleanLinks, lastContactDate:'', createdAt:now });
  }
  saveDB(); closeModal('personModal');
  if (fromRec) {
    if (!editPerId) selPeople.push(pid);
    renderPselGrid(); openModal('recordModal');
  } else {
    refresh();
  }
  toast(editPerId ? '更新しました' : '追加しました');
}
function deleteCurrentPerson() {
  if (!editPerId || !confirm('この人物を削除しますか？\n関連する記録の人物情報も削除されます。')) return;
  db.people = db.people.filter(function(p){ return p.id !== editPerId; });
  db.records.forEach(function(r){
    r.peopleIds = (r.peopleIds||[]).filter(function(id){ return id !== editPerId; });
  });
  saveDB(); closeModal('personModal'); closeModal('personDetailModal');
  refresh(); toast('削除しました');
}

// ─── CONTEXT MENU ────────────────────────────────────────────
function openCtx(e, id) {
  e.stopPropagation();
  ctxRecId = id;
  var m = document.getElementById('ctxMenu');
  m.classList.add('open');
  var rect = e.target.getBoundingClientRect();
  var top  = rect.bottom + 4;
  var left = rect.right - 144;
  if (left < 8) left = 8;
  if (top + 90 > window.innerHeight) top = rect.top - 94;
  m.style.top  = top  + 'px';
  m.style.left = left + 'px';
  setTimeout(function(){ document.addEventListener('click', closeCtx, { once: true }); }, 10);
}
function closeCtx() { document.getElementById('ctxMenu').classList.remove('open'); }
function ctxEdit()   { closeCtx(); if (ctxRecId) openEditRecord(ctxRecId); }
function ctxDelete() {
  closeCtx();
  if (!ctxRecId || !confirm('この記録を削除しますか？')) return;
  db.records = db.records.filter(function(r){ return r.id !== ctxRecId; });
  recalcLastContact();
  saveDB(); refresh(); toast('削除しました');
}

// ─── SCROLL ──────────────────────────────────────────────────
window.addEventListener('scroll', function(){
  document.getElementById('scrollTopBtn').classList.toggle('vis', window.scrollY > 280);
});
document.addEventListener('keydown', function(e){
  if (e.key === 'Escape') {
    ['recordModal','personModal','personDetailModal','dataModal','groupEditModal'].forEach(closeModal);
    closeCtx();
  }
});
